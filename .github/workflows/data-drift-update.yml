name: Update for Vinfast stock data drift 


on:
  

  push: 
      branches: [main]
      paths:


      - 'scripts/check_data_drift.py'
      - '.github/workflows/data-drift-update.yml'

  pull_request:
      branches: [main]



  schedule:
    # This will run every saturday 
    - cron: 0 8 * * 6

jobs:
  
  Check-Vinfast-Data-Drift: 
      runs-on: ubuntu-latest 
      steps:


        - name: Check out repository 
          uses: actions/checkout@v4
          with: 
            lfs: true

        - name: Create streamlit secrets file
          env:
            eod_key: ${{ secrets.FIN_HISTORICAL_DATA }}
            news_api_key: ${{ secrets.NEWS_API_KEY }}
          run: |
            
            mkdir -p .streamlit 
            echo "fin_historical_data = \"$eod_key\"" >> .streamlit/secrets.toml
            echo "news_api_key = \"$news_api_key\"" >> .streamlit/secrets.toml
        - name: Set up UV
          uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9


        - name: Set up Python 
          uses: actions/setup-python@v5
          with: 
            python-version: '3.12.12'
            cache: 'pip'

        - name: Install dependencies
        # Also installing uv 
          run: |
            uv pip install --system -r requirements.txt

        - name: Checking for Data Drift 
          run: |
            python3 scripts/check_data_drift.py 

        - name: Report Failure of Data Drift detection script
          if: failure()  
          run: |
            echo "::error:: There was an error with the script for data drift detection. \
            Please check your scripts."

        - name: Send drift alert email
          if: steps.drift_check.outputs.drift_detected == 'true'
          uses: dawidd6/action-send-mail@v3
          with:
            server_address: smtp.gmail.com
            server_port: 465
            username: ${{ secrets.MAIL_USERNAME }}
            password: ${{ secrets.MAIL_PASSWORD }}
            subject: "⚠️ VinFast model drift detected"
            to: thomas.nguyen3612@gmail.com
            from: GitHub Actions
            body: "Data drift was detected in the VinFast pipeline. Check the logs at ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            
          # including the logs 

        - name: Commit and Push result
          run: |
            git config user.name "Thomas-Nguyen12"
            git config user.email "thomas.nguyen3612@gmail.com"
            git add logs/*.txt
            git commit -m "Added a new file that lists features that have possible undergone data drift" || echo "No changes to commit"
            git push

        - name: Retrain the model 
          if: steps.check_data_drift.outputs.result == 'success'
          run: python3 scripts/update_time_series_model.py
        
        - name: Saving the new models
          run: |
            git config user.name "Thomas-Nguyen12"
            git config user.email "thomas.nguyen3612@gmail.com"
            git pull
            git add models/time_series/vinfast/*.pkl
            git add data/vinfast_data_cleaned.csv 
            git commit -m "Retrained the vinfast models and saved the updated dataset" || echo "No changes to commit"
            git push


        - name: Report Failure for model retraining detection script
          if: failure()  
          run: |
            echo "::error:: There was an error with the script for model retraining. \
            Please check your scripts."
          
