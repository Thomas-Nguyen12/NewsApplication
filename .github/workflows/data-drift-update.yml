name: Update for Vinfast stock data drift 


on:
  

  push: 
      branches: [main]
      paths:


      - 'scripts/check_data_drift.py'
      - '.github/workflows/data-drift-update.yml'

  pull_request:
      branches: [main]



  schedule:

    - cron: 0 12 * * 6

jobs:
  
  Check-Vinfast-Data-Drift: 
      runs-on: ubuntu-latest 
      steps:


        - name: Check out repository 
          uses: actions/checkout@v4

        - name: Create streamlit secrets file
          env:
            eod_key: ${{ secrets.FIN_HISTORICAL_DATA }}
            news_api_key: ${{ secrets.NEWS_API_KEY }}
          run: |
            
            mkdir -p .streamlit 
            echo "fin_historical_data = \"$eod_key\"" >> .streamlit/secrets.toml
            echo "news_api_key = \"$news_api_key\"" >> .streamlit/secrets.toml
        - name: Set up UV
          uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9


        - name: Set up Python 
          uses: actions/setup-python@v5
          with: 
            python-version: '3.12.12'
            cache: 'pip'

        - name: Install dependencies
        # Also installing uv 
          run: |
            uv pip install --system -r requirements.txt

          
          
    