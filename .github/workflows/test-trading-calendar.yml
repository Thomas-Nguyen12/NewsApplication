name: Trading Calendar Edge Case Tests

on:
  push:
    branches: [main]
    # The configured "paths" will ensure that the workflow will run whenever any python files are changed 
    paths:
      - '**.py'
      - '.github/workflows/test-trading-calendar.yml'
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday 06:00 UTC to catch new exchange calendar
    # updates published upstream in pandas_market_calendars
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

jobs:
  # there is only one job, and it tests the trading calendar days 
  test-calendar-edge-cases:
    runs-on: ubuntu-latest

    steps:
      # "actions/checkout@v4" allows you to access repository files during a workflow run 
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.12'
          cache: 'uv'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          uv pip install -r requirements.txt
          pip install pytest

      - name: Run trading calendar tests
        run: pytest tests/test_trading_calendar.py -v

 # This runs if ther eis a failure with the tests
      - name: Report failure summary
        if: failure()
        run: |
          echo "::error::Trading calendar edge case tests failed. \
          This usually means a holiday/early-close date or timezone \
          assumption in the forecasting pipeline is out of date."
