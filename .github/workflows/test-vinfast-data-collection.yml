# this yml file will test the data collection of scripts/test_vinfast_data_collection.py 
#
#

name: Vinfast-Unit-Tests

on: 

  push: 
    branches: [main]
    
    paths: 
      - "**.py" 
      - '.github/workflows/test-vinfast-data-collection.yml'
  pull_request:
    branches: [main]

  schedule: 
    # run this workflow at 08:00 UTC once a week to check if the data collection
    # works 
    - cron: '0 8 * * 1'
  
  # adding a manual "run workflow" button" 
  workflow_dispatch: {} 

jobs: 
  # name of the job 
  vinfast-stock-code-testing: 
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository 
        uses: actions/checkout@v4

      - name: Create streamlit secrets file
        env:
          eod_key: ${{ secrets.FIN_HISTORICAL_DATA }}
          news_api_key: ${{ secrets.NEWS_API_KEY }}
        run: |
          mkdir -p .streamlit 
          echo "fin_historical_data = \"$eod_key\"" >> .streamlit/secrets.toml
          echo "news_api_key = \"$news_api_key\"" >> .streamlit/secrets.toml
      - name: Set up UV
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9


      - name: Set up Python 
        uses: actions/setup-python@v5
        with: 
          python-version: '3.12.12'
          cache: 'pip'

      - name: Install dependencies
     # Also installing uv 
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system pytest

# running in case of failure
      - name: Test Vinfast Data Collection 
        run: |
          pytest tests/test_vinfast_data_collection.py -v 

      - name: Report Data Collection failure summary
        if: failure()
        run: |
          echo "::error:: vinfast data collection tests failed. \
              This usually means that there was an error with the api or \
              how the data was subsequently formatted" 

      - name: Test Trading Calendar 
        run: |
          pytest -v tests/test_trading_calendar.py -v

      - name: Report Trading Calendar failure summary
        if: failure()
        run: |
          echo "::error::Trading calendar edge case tests failed. \
          This usually means a holiday/early-close date or timezone \
          assumption in the forecasting pipeline is out of date."

      - name: Test check Data Drift 
        run: |
          pytest -v tests/test_check_data_drift.py


      - name: Report Data Drift failure summary
        if: failure()
        run: |
          echo "::error:: There was an error in the scripts that detect Data Drift \
          Please check your data drift scripts."
